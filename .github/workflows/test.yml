name: CI
on:
  push:
    branches: [next, canary]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install modules
        run: yarn install --frozen-lockfile
      - name: Typecheck
        run: yarn typecheck
      - name: Run tests
        run: yarn test
      - name: Run tests with the declared cascade forced on
        run: yarn test:declared
      - name: Build
        run: yarn build
      - name: Lint
        run: yarn lint
      # The node tests use a mock sheet, so nothing else here exercises the live CSSOM:
      # rule insertion positions, hydration, and what a browser actually resolves.
      - name: Install Chromium
        run: yarn playwright install --with-deps chromium
      - name: Run the browser check
        run: yarn test:browser
